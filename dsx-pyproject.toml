[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsx"
version = "0.4.0"
description = "DocScript AI (DSX): bahasa deklaratif untuk menyusun dokumen terstruktur"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1", "lxml>=4.9"]

[project.scripts]
dsx = "dsx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
